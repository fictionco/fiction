name: NPM Release Package

on:
  push:
    branches:
      - dev

permissions:
  contents: write
  packages: write

env:
  CI: true
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
  AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
  AWS_ACCESS_KEY_SECRET: ${{ secrets.AWS_ACCESS_KEY_SECRET }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_BUCKET_MEDIA: ${{ secrets.AWS_BUCKET_MEDIA }}
  REDIS_URL: redis://localhost:6379
  CLICKHOUSE_URL: http://default:@localhost:8123
  POSTGRES_URL: http://test:test@localhost:5432/test
  STRIPE_SECRET_KEY_TEST: ${{ secrets.STRIPE_SECRET_KEY_TEST }}
  STRIPE_PUBLIC_KEY_TEST: ${{ secrets.STRIPE_PUBLIC_KEY_TEST }}
  TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  SMTP_HOST: ${{ secrets.SMTP_HOST }}
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
  UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  PROXYCURL_API_KEY: ${{ secrets.PROXYCURL_API_KEY }}
  XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  BETTER_STACK_SOURCE_TOKEN: ${{ secrets.BETTER_STACK_SOURCE_TOKEN }}
  BUILD_COMMIT: ${{ github.sha }}
  BUILD_TIME: ${{ github.event.repository.updated_at }}
  BUILD_NUMBER: ${{ github.run_number }}
  BUILD_BRANCH: ${{ github.ref_name }}
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  MIXPANEL_TOKEN: ${{ secrets.MIXPANEL_TOKEN }}
  MIXPANEL_API_SECRET: ${{ secrets.MIXPANEL_API_SECRET }}
  AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
  SENTRY_PUBLIC_DSN: ${{ secrets.SENTRY_PUBLIC_DSN }}
  SHOULD_RELEASE: ${{ contains(github.event.head_commit.message, '-r') }}

jobs:
  release:
    name: Release to NPM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Verify NPM Token
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "::error::NPM_TOKEN secret is not set"
            exit 1
          fi
          echo "NPM_TOKEN is configured"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.5.0
          cache: pnpm

      - name: Configure NPM Authentication
        run: |
          # Create .npmrc with the actual token value
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN-''}" > ~/.npmrc

          # Also set it in the project root
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN-''}" > .npmrc

          echo "Created .npmrc files"

      - name: Verify NPM Authentication
        run: |
          echo "Checking NPM authentication..."
          npm whoami || (echo "::error::NPM authentication failed" && exit 1)
          echo "Successfully authenticated as: $(npm whoami)"

          # Check access to a specific @fiction package
          echo "Checking access to @fiction/core..."
          npm view @fiction/core name || echo "::warning::Could not verify @fiction/core access"

      - name: Install dependencies
        run: pnpm install

      - name: Run Docker Compose (DB)
        run: docker compose -f ./docker/docker-compose.yml pull && docker compose -f ./docker/docker-compose.yml up --build -d

      - name: Create Tables
        run: npm -w @fiction/www exec -- fiction run generate

      - name: Run unit tests
        run: npm exec -- vitest run unit -u --reporter=./vitest-debug-reporter.js --reporter=verbose

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Release
        run: npm exec -- fiction run release --patch --with-changes --skip-tests
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
