# fly.toml app configuration file generated for fiction-gateway
app = 'fiction-gateway'
primary_region = 'lax'

[build]
dockerfile = './Dockerfile'
build-target = 'fiction-gateway'

[deploy]
strategy = 'bluegreen'

# Using services instead of http_service for TCP passthrough
[[services]]
internal_port = 6565
protocol = "tcp"
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 1
processes = [ "app" ]

# TCP passthrough port
[[services.ports]]
port = 443
handlers = [] # Empty handlers for TCP passthrough

[services.concurrency]
type = 'requests'
hard_limit = 1000
soft_limit = 500

# Health check
[[services.tcp_checks]]
interval = "60s"
timeout = "5s"
grace_period = "10s"

# VM configuration remains the same
[[vm]]
size = 'performance-1x'
memory = '8gb'
cpu_kind = 'performance'
cpus = 1
