# fly.toml for fiction-gateway
app = 'fiction-gateway'
primary_region = 'lax'
kill_timeout = "5s"
kill_signal = "SIGINT"

[build]
dockerfile = './Dockerfile'
build-target = 'fiction-gateway'

[deploy]
strategy = 'bluegreen'

# HTTP Service (Port 80)
[[services]]
protocol = "tcp"
internal_port = 6565
auto_stop_machines = false # Changed to match example
auto_start_machines = false # Changed to match example

[services.concurrency]
hard_limit = 170 # Adjusted to match example
soft_limit = 150 # Adjusted to match example

[[services.ports]]
port = 80
handlers = [ "http" ]

# HTTPS Service (Port 443)
[[services]]
protocol = "tcp"
internal_port = 6565
auto_stop_machines = false
auto_start_machines = false

[services.concurrency]
hard_limit = 170
soft_limit = 150

[[services.ports]]
port = 443
# No handlers for raw TCP mode

[[vm]]
size = 'performance-1x'
memory = '8gb'
cpu_kind = 'performance'
cpus = 1
